[package]
name = "my_lib"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]  # required for wasm

[dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] } # if you need serialization
serde-wasm-bindgen = "0.5" # helpful for passing complex types
wasm-bindgen-futures = "0.4" # if you need async/Promise interop
console_error_panic_hook = "0.1" # helpful for good panic stack traces
